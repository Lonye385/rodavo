name: rodavo_pro
description: Rodavo Pro - migração de React Native para Flutter (Cyberpunk/Neon).
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI/UX (Cyberpunk/Neon)
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Maps (react-native-maps -> google_maps_flutter)
  google_maps_flutter: ^2.10.1

  # Firebase (firebase -> firebase_core + cloud_firestore)
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0

  # Location (expo-location -> geolocator)
  geolocator: ^13.0.2

  # Common utilities
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
